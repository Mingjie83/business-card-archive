<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名片資料庫</title><style>
:root{--ink:#172033;--muted:#667085;--line:#e6e9ef;--bg:#f5f7fb;--brand:#315a78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif;line-height:1.6}.hero{background:linear-gradient(135deg,#21384c,#467996);color:#fff;padding:42px 22px}.wrap{max-width:1100px;margin:auto}.hero h1{margin:4px 0;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:#e8f2f6}.main{padding:24px 22px 50px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.search{flex:1;min-width:250px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:16px}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:700}.filter.active,.filter:hover{background:var(--brand);color:white}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 16px}.stat b{display:block;font-size:22px}.stat span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 26px #17203312}.tag{display:inline-block;border-radius:999px;padding:3px 10px;background:#dbeaf3;color:var(--brand);font-size:12px;font-weight:700}.card h2{margin:9px 0 0;font-size:20px}.role{margin:0 0 10px;color:var(--muted);font-size:14px}.company{font-weight:700;margin-bottom:12px}.details{border-top:1px solid var(--line);padding-top:10px;color:#465266;font-size:14px}.details div{margin:5px 0;overflow-wrap:anywhere}.details strong{display:inline-block;width:44px;color:var(--ink)}.empty{grid-column:1/-1;background:#fff;padding:45px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:15px}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:35px}@media(max-width:600px){.main{padding:18px 14px}.grid{grid-template-columns:1fr}}

let active='全部';const cats=['全部','業主','建築師','廠商'];const q=document.getElementById('q'),filters=document.getElementById('filters'),grid=document.getElementById('grid'),stats=document.getElementById('stats');cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='全部'?' active':'');b.textContent=c;b.onclick=()=>{active=c;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.textContent===active));render()};filters.append(b)});const esc=s=>String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));const line=(k,v)=>v?'<div><strong>'+k+'</strong>'+esc(v)+'</div>':'';function render(){const key=q.value.toLowerCase();const list=data.filter(x=>(active==='全部'||x.c===active)&&(!key||Object.values(x).join(' ').toLowerCase().includes(key)));stats.innerHTML=cats.slice(1).map(c=>'<div class="stat"><b>'+data.filter(x=>x.c===c).length+'</b><span>'+c+'</span></div>').join('')+'<div class="stat"><b>'+list.length+'</b><span>目前顯示</span></div>';grid.innerHTML=list.length?list.map(x=>'<article class="card"><span class="tag">'+x.c+'</span><h2>'+esc(x.n)+'</h2><div class="role">'+esc(x.r||'—')+'</div><div class="company">'+esc(x.o)+'</div><div class="details">'+line('電話',x.p)+line('手機',x.m)+line('傳真',x.f)+line('Email',x.e)+line('地址',x.a)+line('備註',x.x)+'</div></article>').join(''):'<div class="empty">找不到符合的名片，請換個關鍵字或分類。</div>'}q.addEventListener('input',render);render();
